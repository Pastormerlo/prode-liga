name: Traer resultados de Promiedos

on:
  schedule:
    # cada 30 minutos (hora UTC). GitHub puede demorarlo algunos minutos.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar la app y sincronizar
        env:
          PRODE_URL: ${{ secrets.PRODE_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          curl -fsS --retry 4 --retry-delay 20 --max-time 90 "$PRODE_URL/health" > /dev/null
          curl -fsS --max-time 90 -X POST -H "X-Sync-Token: $SYNC_TOKEN" "$PRODE_URL/api/sync"
